name: CI

# The CPU job: no MaleCNS download, no compiled cache/, no GPU. FLYVERSE_DATA points at a path that does
# not exist so anything reaching for the 3 GB dataset fails loudly instead of silently finding a stale copy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: CPU tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLYVERSE_DATA: /nonexistent/malecns   # no dataset in CI; connectome.load() must never be reached
      PYTHONIOENCODING: utf-8
      SDL_VIDEODRIVER: dummy                # tests/test_room_ui.py drives the real pygame loop, headless
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"            # pyproject's floor; the dev machine runs 3.13
          cache: pip
          cache-dependency-path: pyproject.toml

      # torch first, from the CPU index: the default PyPI wheel on Linux is the CUDA build (~2.5 GB) and
      # nothing here needs it. `pip install -e .` then finds the requirement already satisfied and keeps it.
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install flyverse
        run: pip install -e ".[dev]"

      - name: Show the environment
        run: |
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"
          pip check || echo "pip check reported conflicts (informational; the runner image preinstalls packages)"

      # Syntax errors and undefined names only (E9, F63, F7, F82). Style is still deliberately not gated.
      # This step DOES block as of 0.2.0: the 14 pre-existing F821s (scripts/cx_wedge.py 8,
      # scripts/cx_shift.py 4, scripts/compass_driver_trace.py 2 -- every one a closed-over name that a
      # later `del` in the enclosing scope unbound) are fixed, so the count is zero and a regression should
      # fail the run rather than scroll past. 14 is measured, not quoted: ruff 0.16.7 at bffbb0a through
      # this exact invocation. TODO.md section A says 12, which predates scripts/compass_driver_trace.py
      # (added 2026-09-15 at 07cf966) and is stale. The path is `.` and not `flyverse scripts
      # tests`, which left examples/ unlinted.
      - name: Lint (syntax and undefined names)
        run: ruff check . --select E9,F63,F7,F82

      # The command below is the one the docs give a newcomer (README "Run it"; docs/INSTALL.md;
      # docs/REPRODUCIBILITY.md), with -rs --durations=10 added for the log. Keep the three in step.
      # testpaths = ["tests"] comes from pyproject. tests/conftest.py is the only place a file is marked,
      # and it marks by FILE NAME -- the authoritative list is FILE_MARKS there, which today is:
      #   gpu     -> tests/test_cuda.py, tests/test_metal.py  (so CUDA and Metal never run here)
      #   data    -> tests/test_connectome_data.py; tests/test_integration.py (also gpu)
      #   cluster -> nothing; tests/test_cluster_run.py is fully mocked and runs here.
      # Every other tests/test_*.py runs. The files with cache-backed classes guard them with
      # skipUnless((CACHE_DIR / "W_post_pre.npz").exists(), ...) and skip those classes without cache/.
      - name: Tests (no data, no GPU, no cluster)
        run: python -m pytest -m "not gpu and not data and not cluster" -q -rs --durations=10
